<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastel Dual N-Back</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Dual N-Back</h1>
    <button id="menuButton" class="icon-button" aria-label="Open settings" aria-expanded="false">☰</button>
  </header>

  <aside id="settings" class="settings" aria-hidden="true">
    <h2>Settings</h2>
    <label>N-back level
      <input id="nbackInput" type="number" min="1" max="20" value="2">
    </label>
    <label>Rounds
      <input id="roundsInput" type="number" min="1" max="500" value="20">
    </label>
    <label>Seconds between stimuli
      <input id="speedInput" type="number" min="0.25" max="10" step="0.25" value="2">
    </label>
    <button id="applyButton" class="primary">Apply</button>
  </aside>

  <main>
    <section class="game-card">
      <div id="status" class="status">Press space to start</div>

      <div id="stimulus" class="stimulus" aria-label="Stimulus area">
        <div id="shape" class="shape circle"></div>
      </div>

      <div class="controls">
        <button id="shapeButton" class="answer-button" disabled>f : shape</button>
        <button id="colorButton" class="answer-button" disabled>j : color</button>
      </div>

      <div id="roundInfo" class="round-info">Ready</div>
      <div class="hint">Space: start / cancel &nbsp; • &nbsp; F: shape &nbsp; • &nbsp; J: color</div>
    </section>

    <section id="results" class="results hidden">
      <h2>Results</h2>
      <div id="summary"></div>
      <div class="result-grid">
        <div>
          <h3>Shape</h3>
          <div id="shapeResult"></div>
        </div>
        <div>
          <h3>Color</h3>
          <div id="colorResult"></div>
        </div>
      </div>
      <button id="againButton" class="primary">Play again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
